name: Render Video

run-name: Render ${{ inputs.production_id || github.event.issue.title }}

on:
  workflow_dispatch:
    inputs:
      production_id:
        description: Production directory name under productions/
        required: true
        default: oauth-60s
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: video-render-${{ inputs.production_id || github.event.issue.title }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, '[render-video] ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve production ID
        id: resolve
        shell: bash
        env:
          DISPATCH_ID: ${{ inputs.production_id }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            production_id="$DISPATCH_ID"
          else
            production_id="$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^\[render-video\][[:space:]]+//')"
          fi

          if [[ ! "$production_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid production_id: $production_id"
            exit 1
          fi

          echo "production_id=$production_id" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_ID=$production_id" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production input
        shell: bash
        run: |
          set -euo pipefail

          production_dir="productions/$PRODUCTION_ID"
          for file in brief.json storyboard.json edit-plan.json; do
            if [[ ! -f "$production_dir/$file" ]]; then
              echo "::error::Missing required file: $production_dir/$file"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Japanese fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Validate catalogs and types
        shell: bash
        run: npm run check

      - name: Detect runtime needs
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const configPath = path.join("productions", process.env.PRODUCTION_ID, "production.config.json");
          const config = fs.existsSync(configPath)
            ? JSON.parse(fs.readFileSync(configPath, "utf8"))
            : {};

          const needsVoicevox = config.assetProviders?.narration === "voicevox";
          const rawSpeaker = config.providers?.voicevox?.speaker ?? 3;
          const speaker = Number(rawSpeaker);

          if (needsVoicevox && !Number.isFinite(speaker)) {
            throw new Error("Invalid VOICEVOX speaker: " + rawSpeaker);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, "voicevox=" + needsVoicevox + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "voicevox_speaker=" + speaker + "\n");
          console.log("VOICEVOX required: " + needsVoicevox + "; speaker: " + speaker);
          NODE

      - name: Start VOICEVOX Engine
        if: steps.runtime.outputs.voicevox == 'true'
        timeout-minutes: 15
        shell: bash
        env:
          VOICEVOX_IMAGE: ghcr.io/voicevox/voicevox_engine:cpu-0.25.2
          VOICEVOX_SPEAKER: ${{ steps.runtime.outputs.voicevox_speaker }}
        run: |
          set -euo pipefail

          docker pull "$VOICEVOX_IMAGE"
          docker run --rm -d --name voicevox-engine -p 127.0.0.1:50021:50021 "$VOICEVOX_IMAGE"

          ready=0
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:50021/version > "$RUNNER_TEMP/voicevox-version.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "1" ]]; then
            echo "::error::VOICEVOX Engine did not become ready"
            docker logs voicevox-engine || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:50021/speakers > "$RUNNER_TEMP/voicevox-speakers.json"

          node - "$VOICEVOX_SPEAKER" "$RUNNER_TEMP/voicevox-speakers.json" "$RUNNER_TEMP/voicevox-version.json" <<'NODE'
          const fs = require("fs");

          const speakerId = Number(process.argv[2]);
          const speakers = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const version = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));

          let resolved = null;
          for (const speaker of speakers) {
            const style = (speaker.styles ?? []).find((item) => Number(item.id) === speakerId);
            if (style) {
              resolved = { speakerName: speaker.name, styleName: style.name };
              break;
            }
          }

          if (!resolved) {
            throw new Error("VOICEVOX speaker/style id " + speakerId + " was not found");
          }

          const attribution = "VOICEVOX:" + resolved.speakerName;
          fs.appendFileSync(process.env.GITHUB_ENV, "VOICEVOX_URL=http://127.0.0.1:50021\n");
          fs.appendFileSync(process.env.GITHUB_ENV, "VOICEVOX_VERSION=" + version + "\n");
          fs.appendFileSync(process.env.GITHUB_ENV, "VOICEVOX_ATTRIBUTION=" + attribution + "\n");

          console.log("VOICEVOX " + version + ": " + resolved.speakerName + " / " + resolved.styleName + " (id=" + speakerId + ")");
          console.log("Attribution: " + attribution);
          NODE

      - name: Render production
        shell: bash
        run: npm run render -- "$PRODUCTION_ID"

      - name: Stop VOICEVOX Engine
        if: always() && steps.runtime.outputs.voicevox == 'true'
        continue-on-error: true
        shell: bash
        run: docker rm -f voicevox-engine || true

      - name: Verify render output
        shell: bash
        run: |
          set -euo pipefail
          output="outputs/$PRODUCTION_ID.mp4"
          report="productions/$PRODUCTION_ID/.generated/report.json"

          test -s "$output"
          test -s "$report"

          echo "output=$output" >> "$GITHUB_ENV"
          echo "report=$report" >> "$GITHUB_ENV"

      - name: Assemble render artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="artifact/$PRODUCTION_ID"
          mkdir -p "$artifact_dir/production"

          cp "$output" "$artifact_dir/$PRODUCTION_ID.mp4"
          cp "$report" "$artifact_dir/render-report.json"

          for file in brief.json storyboard.json edit-plan.json production.config.json assets.json; do
            src="productions/$PRODUCTION_ID/$file"
            if [[ -f "$src" ]]; then
              cp "$src" "$artifact_dir/production/$file"
            fi
          done

          generated_dir="public/generated/$PRODUCTION_ID"
          if [[ -d "$generated_dir" ]]; then
            cp -R "$generated_dir" "$artifact_dir/generated-assets"
          fi

          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const id = process.env.PRODUCTION_ID;
          const metadata = {
            productionId: id,
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runNumber: process.env.GITHUB_RUN_NUMBER,
            actor: process.env.GITHUB_ACTOR,
            eventName: process.env.GITHUB_EVENT_NAME,
            voicevoxVersion: process.env.VOICEVOX_VERSION ?? null,
            voicevoxAttribution: process.env.VOICEVOX_ATTRIBUTION ?? null,
            createdAt: new Date().toISOString(),
          };

          fs.writeFileSync(
            path.join("artifact", id, "run-metadata.json"),
            JSON.stringify(metadata, null, 2) + "\n",
          );
          NODE

      - name: Upload MP4 and render report
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.resolve.outputs.production_id }}-${{ github.run_number }}
          path: artifact/${{ steps.resolve.outputs.production_id }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Write job summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Video render complete"
            echo
            echo "- Production: \`$PRODUCTION_ID\`"
            echo "- Artifact: \`video-$PRODUCTION_ID-${{ github.run_number }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [[ -n "${VOICEVOX_VERSION:-}" ]]; then
              echo "- Narration: VOICEVOX \`${VOICEVOX_VERSION}\`"
              echo "- Credit: \`${VOICEVOX_ATTRIBUTION}\`"
            fi
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "The artifact contains the MP4, render report, run metadata, production JSON, and generated narration assets used for the render."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report success to render issue
        if: success() && github.event_name == 'issues'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          artifact_name="video-$PRODUCTION_ID-${{ github.run_number }}"

          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body "Render completed for \`$PRODUCTION_ID\`. Artifact: \`$artifact_name\`. Run: $run_url"

          gh issue close "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --reason completed

      - name: Report failure to render issue
        if: failure() && github.event_name == 'issues'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body "Render failed. Run logs: $run_url"
